name: obsidian_vault_datasource
description: A Dart library for working with Obsidian vault datasources using functional programming with fpdart.
version: 1.1.0
homepage: https://github.com/staylorx/obsidian_vault_datasource
repository: https://github.com/staylorx/obsidian_vault_datasource
issue_tracker: https://github.com/staylorx/obsidian_vault_datasource/issues
topics:
  - obsidian
  - vault
  - markdown
  - note-taking

environment:
  sdk: ">=3.0.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  path: ^1.9.0
  equatable: ^2.0.7
  fpdart: ^1.2.0
  yaml: ^3.1.2
  watcher: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  shouldly: ^0.5.0+1
